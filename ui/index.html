<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Agents 团队工作台</title><link rel="stylesheet" href="/style.css"></head><body>
<aside id="left"><header><h1>Crewroom</h1><button id="add-project">＋ 添加项目</button></header><nav id="projects"></nav><section id="quota"></section></aside>
<main><header class="bar"><div><button id="toggle-left">项目</button><h2 id="title">选择项目，开始协作</h2><small id="status">只需与负责人对话</small></div><button id="network-toggle">联网开</button><button id="open-changes">文件改动</button><button id="toggle-right">团队面板</button></header><div id="banner" role="alert"></div><div id="quota-warning" role="alert"></div><section id="waiting" role="status" hidden></section><section id="chat" aria-live="polite"></section><footer><div class="controls"><button id="interrupt">打断负责人</button><button id="pause">暂停</button><details class="more"><summary>更多</summary><button id="rename">会话改名</button><button id="stop">停止会话</button></details></div><form id="composer"><textarea id="message" rows="3" placeholder="给负责人发消息 · Enter 发送 / Shift+Enter 换行" required></textarea><button type="submit">发送</button></form></footer></main>
<aside id="right"><div class="right-head"><h2>团队</h2><small id="team-summary"></small><button id="close-right" title="收起团队面板">收起</button></div><section id="members"></section><nav id="tabs"></nav><section id="panel"></section></aside>
<dialog id="new-session"><form id="team-form"><h2>新建会话</h2><p id="project-path"></p><div id="team"></div><p class="hint"><span id="models-status"></span> <button type="button" id="models-refresh">刷新模型列表</button></p><button type="button" id="add-worker">＋ 成员</button><label>工作空间<select id="mode"><option value="shared">共用目录</option><option value="worktree">每个成员一个工作树</option></select></label><p id="mode-help">共用目录共享改动；工作树隔离各成员的分支和改动。</p><button type="button" id="git-init" hidden>初始化 Git</button><p id="form-error" role="alert"></p><button type="submit">创建会话</button><button type="button" id="cancel-new">取消</button></form></dialog>
<script type="module" src="/app.js"></script></body></html>
